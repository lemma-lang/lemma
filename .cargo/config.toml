# Homebrew keg-only installs on macOS: inkwell 0.10 supports LLVM up to 22.
# [env] never overrides variables already set, so CI sets its own paths.
[env]
LLVM_SYS_221_PREFIX = "/opt/homebrew/opt/llvm@22"
Z3_SYS_Z3_HEADER = "/opt/homebrew/opt/z3/include/z3.h"

[target.aarch64-apple-darwin]
rustflags = ["-L", "/opt/homebrew/opt/z3/lib"]
