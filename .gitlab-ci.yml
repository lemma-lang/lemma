stages:
  - check
  - test
  - security

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  LLVM_SYS_221_PREFIX: "/usr/lib/llvm-22"
  Z3_SYS_Z3_HEADER: "/usr/include/z3.h"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

default:
  image: rust:1.97-trixie
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo-home/registry
      - target/

# Toolchain with LLVM 22 and Z3, for jobs that compile the workspace.
.native-deps:
  before_script:
    - install -d /etc/apt/keyrings
    - curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/llvm.asc
    - echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq
    - apt-get install -y -qq llvm-22-dev libpolly-22-dev libz3-dev libzstd-dev > /dev/null

fmt:
  stage: check
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

commits:
  stage: check
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cargo install --locked cocogitto
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - cog check "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"

clippy:
  stage: check
  extends: .native-deps
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets

test:
  stage: test
  extends: .native-deps
  script:
    - cargo test --workspace

doc:
  stage: test
  extends: .native-deps
  script:
    - cargo doc --workspace --no-deps

deny:
  stage: security
  cache: []
  script:
    - cargo install --locked cargo-deny
    - cargo deny check
