version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    # The major number of llvm-sys is the LLVM version (221 is LLVM 22.1): a new
    # LLVM moves together with inkwell, the CI image and .cargo/config.toml.
    ignore:
      - dependency-name: llvm-sys
        versions: [">= 222"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
