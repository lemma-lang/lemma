name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks that need no LLVM.
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just,typos,taplo,ast-grep
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: taplo fmt --check
      - run: just spell
      - run: just rules

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: cocogitto
      - run: cog check "origin/${{ github.base_ref }}..HEAD"

  # Lint, test and docs on Linux (Debian trixie container: LLVM 22 from apt.llvm.org, Z3 4.13).
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            enabled: true
          # Arm64 Linux runners are free for public repositories only.
          - runner: ubuntu-24.04-arm
            enabled: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.runner }}
    container: rust:1.97-trixie
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      Z3_SYS_Z3_HEADER: /usr/include/z3.h
    steps:
      - if: ${{ !matrix.enabled }}
        run: echo "Skipped while the repository is private."
      - if: matrix.enabled
        uses: actions/checkout@v7
      - if: matrix.enabled
        name: Install LLVM 22 and Z3
        run: |
          install -d /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/llvm.asc
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main" > /etc/apt/sources.list.d/llvm.list
          apt-get update -qq
          apt-get install -y -qq llvm-22-dev libpolly-22-dev libz3-dev libzstd-dev > /dev/null
      - if: matrix.enabled
        uses: Swatinem/rust-cache@v2
      - if: matrix.enabled
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - if: matrix.enabled
        run: just lint
      - if: matrix.enabled
        run: just test
      - if: matrix.enabled
        run: just doc

  # Apple Silicon, the reference target. macOS minutes count ten times on private
  # repositories, so this runs on main only until the repository is public.
  macos:
    if: github.ref == 'refs/heads/main' || !github.event.repository.private
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install llvm@22 z3
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just lint
      - run: just test

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
